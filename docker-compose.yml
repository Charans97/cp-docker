version: "3.8"

services:

  broker-1:
    image: confluentinc/cp-server:7.9.5
    hostname: broker-1
    container_name: broker-1
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker-1:29093,2@broker-2:29093,3@broker-3:29093"

      KAFKA_LISTENERS: "PLAINTEXT://broker-1:29092,CONTROLLER://broker-1:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker-1:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

      KAFKA_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_INTERNAL_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost

      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8085

      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker-1:29092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 3

      CONFLUENT_METRICS_ENABLE: "true"
      CONFLUENT_SUPPORT_CUSTOMER_ID: "anonymous"

      CLUSTER_ID: "XGLyBgiyTfWrm6av1"
      CONFLUENT_LICENSE: <"add license">


  broker-2:
    image: confluentinc/cp-server:7.9.5
    hostname: broker-2
    container_name: broker-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker-1:29093,2@broker-2:29093,3@broker-3:29093"

      KAFKA_LISTENERS: "PLAINTEXT://broker-2:29092,CONTROLLER://broker-2:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker-2:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_INTERNAL_TOPIC_REPLICATION_FACTOR: 3


      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost

      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8085

      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker-1:29092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 3

      CONFLUENT_METRICS_ENABLE: "true"
      CONFLUENT_SUPPORT_CUSTOMER_ID: "anonymous"

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "XGLyBgiyTfWrm6av1"
      CONFLUENT_LICENSE: <"add license">


  broker-3:
    image: confluentinc/cp-server:7.9.5
    hostname: broker-3
    container_name: broker-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker-1:29093,2@broker-2:29093,3@broker-3:29093"

      KAFKA_LISTENERS: "PLAINTEXT://broker-3:29092,CONTROLLER://broker-3:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker-3:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_INTERNAL_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost

      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8085

      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: broker-1:29092
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 3

      CONFLUENT_METRICS_ENABLE: "true"
      CONFLUENT_SUPPORT_CUSTOMER_ID: "anonymous"

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "XGLyBgiyTfWrm6av1"
      CONFLUENT_LICENSE: <"add license">


  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.5
    hostname: schema-registry
    container_name: schema-registry
    depends_on: [broker-1, broker-2, broker-3]
    ports:
      - "8085:8085"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "broker-1:29092,broker-2:29092,broker-3:29092"
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085


  connect:
    image: cnfldemos/cp-server-connect-datagen:0.6.4-7.6.0
    hostname: connect
    container_name: connect
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "broker-1:29092,broker-2:29092,broker-3:29092"
      CONNECT_REST_ADVERTISED_HOST_NAME: connect

      CONNECT_GROUP_ID: connect-cluster

      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3

      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8085


  control-center:
    image: confluentinc/cp-enterprise-control-center:7.9.5
    hostname: control-center
    container_name: control-center
    ports:
      - "9021:9021"
    environment:
      PORT: 9021
      CONTROL_CENTER_BOOTSTRAP_SERVERS: "broker-1:29092,broker-2:29092,broker-3:29092"
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8085
      CONTROL_CENTER_CONNECT_CONNECT-DEFAULT_CLUSTER: connect:8083

      CONTROL_CENTER_REPLICATION_FACTOR: 3
      CONFLUENT_METRICS_TOPIC_REPLICATION: 3
      CONTROL_CENTER_TOPIC_REPLICATION_FACTOR: 3

  rest-proxy:
    image: confluentinc/cp-kafka-rest:7.9.5
    hostname: rest-proxy
    container_name: rest-proxy
    ports:
      - "8082:8082"
    environment:
      KAFKA_REST_BOOTSTRAP_SERVERS: "broker-1:29092,broker-2:29092,broker-3:29092"
      KAFKA_REST_SCHEMA_REGISTRY_URL: http://schema-registry:8085
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082
